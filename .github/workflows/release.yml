name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_as:
        description: 'Force a version X.Y.Z (default: from the conventional commits)'
        type: string
      dry_run:
        description: 'Bump and build the notes only: no push, images, deploy or back-merge'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: CI
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      security-events: write # required for uploading results to code scanning

  release:
    name: Release
    needs: [ci]
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/release-hosted.yml@bf7ce40db2970dfc8cf349ca84d3fd924e779c4d # v0.2.10
    with:
      notices: client server
      release-as: ${{ inputs.release_as }}
      dry-run: ${{ inputs.dry_run == true }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read # checkout; the push and the release go through the release App token

  client-image:
    name: Client image
    needs: [release]
    if: ${{ inputs.dry_run != true }}
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/container-publish.yml@bf7ce40db2970dfc8cf349ca84d3fd924e779c4d # v0.2.10
    with:
      name: client
      dockerfile: client/Dockerfile
      ref: v${{ needs.release.outputs.version }}
      tags: |
        type=semver,pattern=v{{version}},value=v${{ needs.release.outputs.version }}
        type=semver,pattern=v{{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
        type=sha,format=short
        type=raw,value=latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      packages: write # push the image and its attestations
      id-token: write # required to sign the attestations
      attestations: write # required to persist the attestations
      security-events: write # required for uploading the image scan to code scanning
      artifact-metadata: write # actions/attest records the pushed image as an artifact of the repository

  server-image:
    name: Server image
    needs: [release]
    if: ${{ inputs.dry_run != true }}
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/container-publish.yml@bf7ce40db2970dfc8cf349ca84d3fd924e779c4d # v0.2.10
    with:
      name: server
      dockerfile: server/Dockerfile
      ref: v${{ needs.release.outputs.version }}
      tags: |
        type=semver,pattern=v{{version}},value=v${{ needs.release.outputs.version }}
        type=semver,pattern=v{{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
        type=sha,format=short
        type=raw,value=latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      packages: write # push the image and its attestations
      id-token: write # required to sign the attestations
      attestations: write # required to persist the attestations
      security-events: write # required for uploading the image scan to code scanning
      artifact-metadata: write # actions/attest records the pushed image as an artifact of the repository

  production:
    name: Production
    needs: [release, client-image, server-image]
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.DEPLOY_PRODUCTION) }}
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/deploy-ssh.yml@bf7ce40db2970dfc8cf349ca84d3fd924e779c4d # v0.2.10
    with:
      environment: ${{ matrix.environment }}
      images: >-
        {"server": "v${{ needs.release.outputs.version }}@${{ needs.server-image.outputs.digest }}",
         "client": "v${{ needs.release.outputs.version }}@${{ needs.client-image.outputs.digest }}"}
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
    permissions:
      packages: read # the token piped to the gateway lets the host pull the images

  back-merge:
    name: Back-merge
    needs: [release]
    if: ${{ inputs.dry_run != true }}
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/back-merge.yml@bf7ce40db2970dfc8cf349ca84d3fd924e779c4d # v0.2.10
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read # checkout; the push goes through the release App token
