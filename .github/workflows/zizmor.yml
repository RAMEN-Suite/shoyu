name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: [dev, main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: Run Zizmor
    runs-on: ubuntu-latest
    if: github.head_ref != 'dev' && github.head_ref != 'main'
    permissions:
      security-events: write # required for uploading results to code scanning
      contents: read # only needed for private repos — needed to clone the repo
      actions: read # only needed for private repos — needed for upload-sarif to read workflow run info
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: ${{ github.event.repository.visibility == 'public' }}
