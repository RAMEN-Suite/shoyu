name: Server CI

on:
  pull_request:
    paths:
      - "server/**"
      - "schema/**"
      - ".github/workflows/server.yml"
  push:
    branches: [dev, main]
    paths:
      - "server/**"
      - "schema/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: server

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  node-ci:
    name: node checks
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    if: github.head_ref != 'dev' && github.head_ref != 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check dependency licenses
        run: npx license-checker --production --failOn "GPL-2.0;GPL-3.0;AGPL-3.0;AGPL-1.0"
      - name: Generate license report
        if: always()
        run: npx license-checker --excludePrivatePackages --production --markdown --out licenses-npm.md
      - name: Write license summary
        if: always()
        run: |
          {
            echo "## NPM Dependency Licenses"
            echo ""
            echo "### Summary"
            echo ""
            echo "| License | Count |"
            echo "|---|---|"
            npx license-checker --excludePrivatePackages --production --json | jq -r '
              [.[].licenses]
              | flatten
              | group_by(.)
              | map({license: .[0], count: length})
              | sort_by(-.count)
              | .[]
              | "| \(.license) | \(.count) |"
            '
            echo ""
            echo "<details><summary>Full package list</summary>"
            echo ""
            cat licenses-npm.md
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lint
        run: npm run lint
      - name: Format Check
        run: npm run format
        continue-on-error: true
      - name: Build
        run: npm run build
  dev-container:
    name: dev container
    needs: [node-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      packages: write # required to push the built image to the Container registry (docker/login-action + build-push-action)
      security-events: write # required for uploading results to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-server
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=short
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          pull: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
      - name: Upload trivy scan results
        if: always() && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy
          path: trivy.sarif
      - name: Upload trivy report to security tab
        if: always() && github.event.repository.visibility == 'public' && github.ref == 'refs/heads/dev'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif

      - name: Generate License Report
        env:
          IMAGE_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grant/v0.6.7/install.sh | sh -s -- -b /usr/local/bin
          grant -f licenses.json list "$IMAGE_TAG"
      - name: Check image licenses
        run: |
          if jq -e '[.run.targets[].evaluation.findings.packages[].licenses[]?.id // "" | select(test("AGPL"; "i"))] | length > 0' licenses.json > /dev/null; then
            echo "::error::AGPL-licensed package found"
            jq -r '.run.targets[].evaluation.findings.packages[] | select(.licenses[]?.id // "" | test("AGPL"; "i")) | "\(.name) \(.version)"' licenses.json
            exit 1
          fi
          echo "No AGPL licenses found."
      - name: Write license summary
        if: always() && github.ref == 'refs/heads/dev'
        run: |
          {
            echo "## License Report"
            echo ""
            echo "| License | Packages | Risk |"
            echo "|---|---|---|"
            jq -r '
              [.run.targets[].evaluation.findings.packages[].licenses[]? | select(.id != null)]
              | group_by(.id)
              | map({license: .[0].id, count: length, risk: (.[0].riskCategory // "Unknown")})
              | sort_by(-.count)
              | .[]
              | "| \(.license) | \(.count) | \(.risk) |"
            ' licenses.json
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: dev deploy
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    needs: [dev-container]
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      packages: read # the token piped to the gateway logs the host in to the registry for docker compose pull
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: development
            stack: shoyu/shoyu
          - environment: staging
            stack: dev/shoyu
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install SSH Key
        env:
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key
          cat >>~/.ssh/config <<END
          Host staging
            HostName $HOST
            User $USER
            IdentityFile ~/.ssh/staging.key
          END
      - name: Deploy the dev image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STACK: ${{ matrix.stack }}
        run: printf '%s' "$GH_TOKEN" | ssh staging deploy "$STACK" server dev
