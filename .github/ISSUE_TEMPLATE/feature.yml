name: Feature request
description: Suggest a new capability or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should Shoyu solve for the edition or its readers?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe the expected result. A configuration or UI example is optional.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
